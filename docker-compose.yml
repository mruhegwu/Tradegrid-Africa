version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    image: tradegrid-africa/web:local
    container_name: tradegrid_web
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    image: tradegrid-africa/api:local
    container_name: tradegrid_api
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://tradegrid:tradegrid@db:5432/tradegrid}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: tradegrid_db
    environment:
      POSTGRES_USER: tradegrid
      POSTGRES_PASSWORD: tradegrid
      POSTGRES_DB: tradegrid
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tradegrid']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradegrid_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
